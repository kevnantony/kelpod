# Run configuration of this branch (read by kelpod.runconfig and scripts/locked_eval.py).
# learned-v2: U-Net ResNet-34 trained with style_v2 randomisation, 64k iterations, 2 seeds (ONNX,
# whole-page inference at 0.65x, LearnedSegmenter defaults). Training manifests: every
# training/manifests/*.json (checked by scripts/locked_eval.py --verify-manifests).
version = 1
segment_backend = "learned"
ocr_backend = "rapidocr"
python_project = "."

[[checkpoints]]
seed = 1
path = "~/kelpod-models/kelpod-seg/v2-s1/model.onnx"
sha256 = "a7415f6715ade2ca5e8b79f00b0e7febabfaeea5d71f77f5a756fbddd17e66ba"

