[project]
name = "kelpod"
version = "0.1.0"
description = "Old German floor-plan scans to closed IFC models for energy software"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Arsha Fahima Tajdeen" }, { name = "Kevin Antony" }]
# Open-source, educational repo: any open-source licence is fine; credit everything in CREDITS.md.
dependencies = [
    "numpy>=1.26",               # BSD
    "pydantic>=2.7",             # MIT
    "opencv-python-headless>=4.10", # Apache-2.0
    "scikit-image>=0.24",        # BSD
    "pypdfium2>=4.30",           # Apache-2.0 / BSD
    "pillow>=10.4",              # MIT-CMU (HPND)
    "shapely>=2.0",              # BSD
    "scipy>=1.13",               # BSD
    "networkx>=3.3",             # BSD
    "ifcopenshell>=0.8",         # LGPL-3.0, used as a library
    "rapidocr-onnxruntime>=1.3", # Apache-2.0 (PaddleOCR models via ONNX Runtime, MIT)
    "typer>=0.12",               # MIT
    "ortools>=9.10",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
kelpod = "kelpod.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kelpod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end or OCR-model tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
