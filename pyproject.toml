[project]
name = "zllf"
version = "0.0.1"
description = "Zero-Leak LoRA Factory: offline documents-to-LoRA appliance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    # db / api
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    # ingest
    "docling>=2.0",
    "datasketch>=1.6",
    # sanitize
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "lingua-language-detector>=2.0",
    # models
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "mlx>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.19; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # train / hpo
    "optuna>=3.6",
    # evaluate
    "rouge-score>=0.1.2",
    "faiss-cpu>=1.8",
    "jsonschema>=4.22",
    # package / report
    "cyclonedx-python-lib>=7.0",
    "cryptography>=42.0",
    "matplotlib>=3.9",
    "fpdf2>=2.7",
]

[project.scripts]
zllf = "zllf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zllf"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# frozen dataclasses are immutable, so they are safe as default arguments
extend-immutable-calls = ["zllf.llm.base.SamplingParams"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "zllf.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "mlx: needs Apple Silicon + MLX and a downloaded toy model",
    "slow: takes more than ~30 s",
]
