# ZLLF appliance stack (CPU image). NFR-SEC-01 / P1.10.3.
#
#   docker compose -f deploy/compose/compose.yaml up -d
#
# Network design:
#   * `internal` is `internal: true`: Docker gives it no route off the host, so api and worker
#     cannot reach anything except each other. Docker also does not publish ports from
#     containers that are only on internal networks.
#   * `edge` is the only network with a host port: the `gateway` (unprivileged nginx, fixed
#     reverse-proxy config, no data volumes) sits on both and publishes the UI/API port.
#     The gateway is the only container with a route out; on appliances the host firewall
#     (deploy/egress/nftables-appliance.nft) drops that egress as well.
#
# Only ${ZLLF_BIND:-127.0.0.1}:${ZLLF_PORT:-8080} is exposed. Set ZLLF_BIND=0.0.0.0 to serve the LAN.

name: zllf

x-zllf-common: &zllf-common
  image: ${ZLLF_IMAGE:-zllf-app:dev}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=1g,mode=1777
  environment:
    ZLLF_HARDWARE: ${ZLLF_HARDWARE:-fake}
    ZLLF_DATA_DIR: /data
  volumes:
    - zllf-data:/data
    - zllf-models:/data/models:ro
  networks: [internal]
  restart: unless-stopped

services:
  api:
    <<: *zllf-common
    command: ["serve-api", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    <<: *zllf-common
    command: ["worker"]
    depends_on: [api]
    healthcheck:
      disable: true

  gateway:
    image: ${ZLLF_GATEWAY_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ZLLF_BIND:-127.0.0.1}:${ZLLF_PORT:-8080}:8080"
    networks: [edge, internal]
    depends_on: [api]
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge: {}

volumes:
  zllf-data: {}
  # Populated offline by deploy/bundle/install.sh (HF cache layout: /data/models/hub/models--*).
  zllf-models: {}
