# Reverse proxy: host port -> api:8000 on the internal network. No caching, no external upstreams.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 2g;          # document uploads

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;     # SSE progress streams
        proxy_buffering off;
    }
}
