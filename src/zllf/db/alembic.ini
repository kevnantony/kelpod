# Alembic config for the ZLLF database. script_location and sqlalchemy.url are set
# programmatically by zllf.db.engine.alembic_config(); this file keeps CLI use possible:
#   cd src/zllf/db && uv run alembic -x url=sqlite:////path/zllf.db upgrade head
[alembic]
script_location = %(here)s/migrations
sqlalchemy.url = sqlite:///zllf.db
